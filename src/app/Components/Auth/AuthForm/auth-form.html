<div class="auth">
  @if (returnUrl) {
    <p class="reason">Inicia sesión para jugar</p>
  }

  <button type="button" class="primary guest" [disabled]="loading()" (click)="playAsGuest()">
    Jugar como invitado
  </button>

  <div class="divider"><span>o con tu cuenta</span></div>

  <button type="button" class="google" [disabled]="loading()" (click)="continueWithGoogle()">
    <span class="g-icon">G</span> Continuar con Google
  </button>

  <form (ngSubmit)="submit()">
    <input
      *ngIf="mode() === 'register'"
      type="text"
      name="username"
      placeholder="Nombre de entrenador"
      aria-label="Nombre de entrenador"
      autocomplete="username"
      [(ngModel)]="username"
    />
    <input
      type="email"
      name="email"
      placeholder="Email"
      aria-label="Email"
      autocomplete="email"
      [(ngModel)]="email"
    />
    <input
      type="password"
      name="password"
      placeholder="Contraseña"
      aria-label="Contraseña"
      [attr.autocomplete]="mode() === 'login' ? 'current-password' : 'new-password'"
      [(ngModel)]="password"
    />

    <p class="msg error" role="alert" *ngIf="errorMsg()">{{ errorMsg() }}</p>
    <p class="msg info" role="status" *ngIf="infoMsg()">{{ infoMsg() }}</p>

    <button type="submit" class="secondary" [disabled]="loading()">
      {{ loading() ? '...' : mode() === 'login' ? 'Entrar con correo' : 'Crear cuenta' }}
    </button>
  </form>

  <button type="button" class="link" (click)="toggleMode()">
    {{ mode() === 'login' ? '¿No tienes cuenta? Crear una' : '¿Ya tienes cuenta? Iniciar sesión' }}
  </button>

  <a routerLink="/privacy" class="privacy-link">Política de privacidad</a>
</div>
