<div class="arena" *ngIf="battle.battleId(); else waiting">
  <!-- Rival -->
  <div class="fighter opponent" *ngIf="battle.opponentActive() as o">
    <div class="row">
      <div class="meta">
        <span class="name">{{ o.name }}</span>
        <span class="hp-num">{{ o.currentHp }} / {{ o.maxHp }}</span>
        <div class="hp-track">
          <div #opponentHp class="hp-fill" [style.background]="hpColor(hpPct(o))"></div>
        </div>
      </div>
      <img #opponentSprite class="sprite" [src]="o.sprite" [alt]="o.name" />
    </div>
  </div>

  <div class="vs">VS</div>

  <!-- Jugador -->
  <div class="fighter player" *ngIf="battle.playerActive() as p">
    <div class="row">
      <img #playerSprite class="sprite" [src]="p.sprite" [alt]="p.name" />
      <div class="meta">
        <span class="name">{{ p.name }}</span>
        <span class="hp-num">{{ p.currentHp }} / {{ p.maxHp }}</span>
        <div class="hp-track">
          <div #playerHp class="hp-fill" [style.background]="hpColor(hpPct(p))"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Controles / resultado -->
  <div class="controls">
    <ng-container *ngIf="!battle.isOver(); else result">
      <ng-container *ngIf="phase() === 'minigame'; else moves">
        <app-semaphore-minigame
          *ngIf="selectedMoveIndex() === 0"
          (outcome)="onMinigameOutcome($event)"
        ></app-semaphore-minigame>
        <app-timing-bar-minigame
          *ngIf="selectedMoveIndex() === 1"
          (outcome)="onMinigameOutcome($event)"
        ></app-timing-bar-minigame>
        <app-keyboard-letters-minigame
          *ngIf="selectedMoveIndex() === 2"
          (outcome)="onMinigameOutcome($event)"
        ></app-keyboard-letters-minigame>
      </ng-container>

      <ng-template #moves>
        <div class="moves">
          <button
            *ngFor="let m of moveList(); let i = index"
            type="button"
            class="move"
            [disabled]="busy()"
            (click)="selectMove(i)"
          >
            {{ m.name }}
          </button>
        </div>
      </ng-template>

      <p class="err" *ngIf="attackError()">{{ attackError() }}</p>
    </ng-container>

    <ng-template #result>
      <p
        class="outcome"
        [class.win]="battle.status() === 'win'"
        [class.lose]="battle.status() === 'lose'"
      >
        {{ battle.status() === 'win' ? '¡Ganaste!' : 'Perdiste' }}
      </p>
      <p class="rewards" *ngIf="battle.rewards() as r">
        +{{ r.xpGained }} XP<span class="levelup" *ngIf="r.leveledUp">
          · ¡Subiste a nivel {{ r.newLevel }}!</span
        >
      </p>
      <button class="menu" (click)="backToMenu()">Volver al menú</button>
    </ng-template>
  </div>
</div>

<ng-template #waiting>
  <p class="waiting">{{ battle.notice() || 'Preparando combate…' }}</p>
</ng-template>
