<div class="trainer-panel">
  <app-trainer-profile
    *ngIf="view() === 'profile'"
    [notice]="notice()"
    (chooseTeam)="openTeam()"
  ></app-trainer-profile>

  <app-team-select
    *ngIf="view() === 'team'"
    (saved)="onTeamSaved()"
    (done)="view.set('profile')"
  ></app-team-select>
</div>
