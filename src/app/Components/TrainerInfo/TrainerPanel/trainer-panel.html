<div class="trainer-panel">
  <app-auth-form *ngIf="view() === 'login'"></app-auth-form>

  <app-trainer-profile
    *ngIf="view() === 'profile'"
    (chooseTeam)="view.set('team')"
  ></app-trainer-profile>

  <app-team-select
    *ngIf="view() === 'team'"
    (done)="view.set('profile')"
  ></app-team-select>
</div>
